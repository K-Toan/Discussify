  #    - "6001:443"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ASPNETCORE_HTTP_PORTS=80
  #     - ASPNETCORE_HTTPS_PORTS=443
  #   volumes:
  #     - ./Discussify.PostService:/src/Discussify.ApiGateway
  
  identity-service:
    image: ${DOCKER_REGISTRY-}identity-service:v1
    build:
      context: ./Discussify.IdentityService
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "7000:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=80
      - ASPNETCORE_HTTPS_PORTS=443
      - ConnectionStrings__IdentityServiceDB=Host=postgres;Port=5432;Username=postgres;Password=postgrespw;Database=IdentityServiceDB
    volumes:
      - ./Discussify.IdentityService:/src/Discussify.IdentityService
    depends_on:
      - postgres

